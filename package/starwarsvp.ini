; Star Wars VP display settings, package defaults for a Wells-Gardner 6100
; on a USB-DVG. The cabinet's own tuning goes to save/starwarsvp.ini
; (starwarsvp --calibrate, button 2 saves) and overrides these.

; AVG window (AVG units) stretched to the board's 0..4095: the game's own
; screen edges VGEDGL/R/B/T (-510..510, -612..600 in its vector words) at
; the scale the game draws at, a quarter
avg_left = -127.5
avg_right = 127.5
avg_bottom = -153
avg_top = 150

; margins in board units (overscan, tube edge)
margin_left = 64
margin_right = 64
margin_bottom = 64
margin_top = 64
flip_x = 0
flip_y = 0

; beam = floor + (1 - floor) * (intensity/255)^gamma, times brightness
gamma = 1
floor = 0.12
brightness = 1.7

; board RGB per AVG color at full intensity (balance the WG6100's guns here)
color_blue = 0 0 255
color_green = 0 255 0
color_turquoise = 0 255 255
color_red = 255 0 0
color_purple = 255 0 255
color_yellow = 255 255 0
color_white = 255 255 255

; FUZZ glow: 0 ignore, 1 double-draw
defocus_mode = 1

; The sight is centered from the first frame: the yoke is passed through
; exactly, its rest position comes from the cabinet's joystick calibration
; (Settings, CONTROLS, CALIBRATE). 0: as the arcade machine, which learns
; the yoke's range anew after every power-on.
yoke_autocenter = 1

; Motion between the game's frames (the game computes 12 to 20 a second):
; 0 off: every game frame as it is, as the arcade machine shows it
; 1 between the last two frames: exact, the world one game frame late
; 2 ahead of the last frame: no delay, turning lines overshoot a little
smooth = 3

